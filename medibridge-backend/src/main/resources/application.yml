spring:
  application:
    name: medibridge-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medibridge}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' fails fast if an entity and the
      # migration disagree, which is exactly what we want.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    # Deliberately false. With baseline-on-migrate=true, pointing at a database
    # that already has tables makes Flyway silently baseline and skip V1 - which
    # is how a schema mismatch hides instead of failing loudly.
    baseline-on-migrate: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    context-path: /api      # matches VITE_API_BASE_URL in the frontend .env
  error:
    include-stacktrace: never
    include-message: never

# Only /health and /info are public. Everything else on actuator is locked
# down in SecurityConfig - /actuator/env would otherwise leak DB and JWT secrets.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.medibridge: DEBUG
    org.hibernate.SQL: DEBUG

medibridge:
  cors:
    allowed-origins: http://localhost:5173

  ratelimit:
    # X-Forwarded-For is attacker-controlled unless a proxy overwrites it, so it
    # is ignored by default. Turn this on ONLY when the app sits behind one -
    # otherwise a caller can mint a new identity per request and skip the limit.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    auth:
      # Per source address, per endpoint, over a sliding window. Generous enough
      # for someone mistyping a password, far too tight to guess one.
      max-attempts: 10
      window-seconds: 60

  jwt:
    # Override in application-local.yml. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-in-application-local-yml-min-32-bytes-long}
    access-token-minutes: 15
    refresh-token-days: 7

  internal:
    # Shared secret for trusted service-to-service calls (the .NET notify
    # service), checked by InternalApiKeyAuthFilter against the
    # X-Internal-Api-Key header. Blank = the filter never matches, so
    # /internal/** stays unreachable - fail closed, same convention as
    # google.client-id and razorpay.key-id below.
    api-key: ${INTERNAL_API_KEY:}

  storage:
    # Uploaded medical reports. Kept outside the app so files survive redeploys.
    upload-dir: ${UPLOAD_DIR:./storage/reports}

  follow-up:
    # One free revisit with the same doctor after a completed consultation.
    # These are the DEFAULTS: SettingsProvider passes them as the fallback to a
    # system_settings row, so an admin can still retune the window without a
    # redeploy. Turning this off leaves existing follow-ups alone - it only
    # stops new ones being booked.
    enabled: ${FOLLOW_UP_ENABLED:true}
    window-days: ${FOLLOW_UP_WINDOW_DAYS:7}

  otp:
    # Phone login. DEFAULTS only - SettingsProvider passes each as the fallback
    # to a system_settings row, so an admin can retune them without a redeploy.
    #
    # A six-digit code is one in a million, which is only worth anything because
    # of the three values under it: it expires, it survives a handful of guesses,
    # and one number cannot ask for a new one every second. Weaken any of those
    # and the length stops meaning what it looks like it means.
    length: ${OTP_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # Also enforced per NUMBER in the database, not just per IP in memory:
    # every send costs money at the gateway.
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}

  meeting:
    # No Zoom SDK/integration: we generate a unique room URL per appointment and
    # email it. Jitsi Meet needs no account or API key. Swap the base URL for a
    # Zoom/Meet/Teams personal room later without touching any code.
    base-url: https://meet.jit.si/
    room-prefix: medibridge-

  mail:
    from: ${MAIL_FROM:no-reply@medibridge.com}
    # false = log the email body to console instead of sending (dev default)
    enabled: ${MAIL_ENABLED:false}

  sms:
    # false = log the SMS/WhatsApp body to console instead of sending (dev default).
    # Set true with Twilio credentials below to deliver real messages.
    enabled: ${SMS_ENABLED:false}
    # SMS or WHATSAPP — which Twilio channel outbound messages use.
    channel: ${SMS_CHANNEL:WHATSAPP}
    twilio:
      account-sid: ${TWILIO_SID:}
      auth-token: ${TWILIO_TOKEN:}
      # Twilio SMS sender number, e.g. +12025550123 (only needed for SMS channel)
      from-sms: ${TWILIO_FROM_SMS:}
      # WhatsApp sender. The Twilio sandbox number is +14155238886.
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:+14155238886}

  google:
    # OAuth 2.0 Web client ID from Google Cloud Console.
    # Blank = Google Sign-In disabled and the button is hidden.
    # This value is public; there is no client secret in this flow.
    client-id: ${GOOGLE_CLIENT_ID:}

  razorpay:
    # Test keys from the Razorpay dashboard (rzp_test_...).
    # Blank = payments fall back to the simulated form.
    key-id: ${RAZORPAY_KEY_ID:}
    # NEVER commit this and never send it to the browser - it is what makes
    # the payment signature unforgeable.
    key-secret: ${RAZORPAY_KEY_SECRET:}
