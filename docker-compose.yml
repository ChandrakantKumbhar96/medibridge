name: medibridge

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-medibridge}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: chandrakantdevop/medibridge-backend:latest
    build: ./medibridge-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medibridge}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@medibridge.com}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_CHANNEL: ${SMS_CHANNEL:-WHATSAPP}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_FROM_SMS: ${TWILIO_FROM_SMS:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-+14155238886}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  chat-service:
    image: chandrakantdevop/medibridge-chat-service:latest
    build: ./medibridge-chat-service
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PORT: 8000
      ENV: production
      CORS_ORIGIN: http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-openai/gpt-oss-120b}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY}
      SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY}
      SPRING_API_URL: http://backend:8080/api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  notify-service:
    image: chandrakantdevop/medibridge-notify-service:latest
    build:
      context: ./medibridge-notify-service
      dockerfile: src/MediBridge.Notify.Api/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      Spring__BaseUrl: http://backend:8080/api/
      Spring__InternalApiKey: ${SPRING_INTERNAL_API_KEY}
      Twilio__AccountSid: ${TWILIO_SID:-}
      Twilio__AuthToken: ${TWILIO_TOKEN:-}
      Twilio__FromNumber: ${TWILIO_FROM_SMS:-}
    restart: unless-stopped

  gateway:
    image: chandrakantdevop/medibridge-gateway:latest
    build: ./medibridge-gateway
    depends_on:
      backend:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notify-service:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      SPRING_API_URL: http://backend:8080
      CHAT_SERVICE_URL: http://chat-service:8000
      NOTIFY_SERVICE_URL: http://notify-service:8000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: chandrakantdevop/medibridge-frontend:latest
    build:
      context: ./medibridge-frontend
      args:
        VITE_GATEWAY_API_URL: http://localhost:4000/api
        VITE_USE_MOCK: "false"
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mysql-data:
